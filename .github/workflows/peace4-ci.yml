name: Peace 4 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore day-1/peace4/OrderRefactor.Tests/OrderRefactor.Tests.csproj

      - name: Build
        run: dotnet build day-1/peace4/OrderRefactor/OrderRefactor.csproj --no-restore

      - name: Test
        run: dotnet test day-1/peace4/OrderRefactor.Tests/OrderRefactor.Tests.csproj --no-restore