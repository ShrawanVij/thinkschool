name: Peace 7 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore day-3/Peace7/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Test
        run: dotnet test day-3/Peace7/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-restore